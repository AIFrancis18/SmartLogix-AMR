spring.cloud.gateway.server.webmvc.routes[2].id=servicio-envio
spring.cloud.gateway.server.webmvc.routes[2].uri=http://localhost:8083
spring.cloud.gateway.server.webmvc.routes[2].predicates[0]=Path=/envios/**